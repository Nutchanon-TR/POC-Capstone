<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>All 21 screens · Connecta design overview</title>
  <link rel="icon" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .overview { max-width:1500px; width:calc(100% - 64px); margin:0 auto; padding:42px 0 70px; }
    .overview-head { display:flex; justify-content:space-between; align-items:center; gap:24px; margin-bottom:36px; }
    .overview-head h1 { font-size:2.3rem; margin-bottom:10px; }
    .screen-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px; }
    .screen { display:block; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--white); transition:transform .2s; }
    .screen:hover { transform:translateY(-4px); }
    .screen-shot { aspect-ratio:1.44; background:var(--subtle); overflow:hidden; border-bottom:1px solid var(--border); }
    .screen img { width:100%; height:100%; object-fit:cover; object-position:top; }
    .screen-caption { padding:17px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .screen-caption h2 { font-size:.875rem; }
    .screen-caption span { color:var(--blue); font-size:.6875rem; }
    @media(max-width:960px) { .screen-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media(max-width:600px) { .overview{width:calc(100% - 32px);padding-top:28px;} .screen-grid{grid-template-columns:1fr;} .overview-head{flex-direction:column;align-items:flex-start;} .overview-head h1{font-size:1.9rem;} }
  </style>
</head>
<body>
  <main class="overview">
    <header class="overview-head"><div><h1>The whole Connecta experience.</h1><p>21 screens. One shared space. Choose a screen to try the interactive design.</p></div><a class="btn" href="index.html#home">Open interactive preview</a></header>
    <div class="screen-grid" id="screens"></div>
    <p class="field-note" style="margin-top:30px">Static captures from the HTML preview. In the interactive version, characters walk and idle, pages reveal on scroll, and panels respond to your actions.</p>
  </main>
  <script>
    const screens=[['home','Landing'],['events','Discover events'],['signup','Create account'],['signin','Sign in'],['event','Event & projects'],['avatar','Character & device lobby'],['hall','Visitor hall'],['judge','Judge hall'],['schedule','Agenda & speakers'],['presenter','Exhibitor workspace'],['organizer','Organizer overview'],['create-event','Create an event'],['analytics','Event report'],['profile','Profile & contacts'],['submission','Submit a project'],['submissions','Submissions & hall'],['judging-setup','Judging setup'],['moderation','Moderation'],['gallery','After-event gallery'],['recap','Your recap'],['platform','Platform console']];
    document.getElementById('screens').innerHTML=screens.map(([id,title])=>`<a class="screen" href="index.html#${id}"><div class="screen-shot"><img src="screenshots/${id}-desktop.png" alt="${title} design" width="1440" height="1000" loading="lazy"></div><div class="screen-caption"><h2>${title}</h2><span>Try this screen →</span></div></a>`).join('');
  </script>
</body>
</html>
