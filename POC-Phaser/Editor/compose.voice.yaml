name: connecta-voice
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ['--config', '/etc/livekit.yaml']
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'
    volumes:
      - ./infra/livekit.local.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
